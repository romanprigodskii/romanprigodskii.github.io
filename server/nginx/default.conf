# The site is plain files. Nothing in it is fingerprinted (site.js is always
# site.js), so HTML, CSS, JS and the chart data are revalidated on every
# visit rather than cached blind: a deploy shows up on the next load, and an
# unchanged file costs a 304. Fonts, screenshots and the product loops change
# rarely enough to cache; the PDFs may be replaced by camera-ready versions, so they get an hour.
map $sent_http_content_type $site_cache {
    default            "no-cache";
    ~^font/            "public, max-age=2592000";
    ~^image/           "public, max-age=86400";
    ~^video/           "public, max-age=86400";
    application/pdf    "public, max-age=3600";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;

    # Traefik speaks https to the world; nginx only sees http on :80. Relative
    # redirects keep /research -> /research/ from pointing at http://...:80.
    absolute_redirect off;

    error_page 404 /404.html;

    add_header Cache-Control $site_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
