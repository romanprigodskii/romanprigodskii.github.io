# The site is plain files. The pages and the chart data are revalidated on
# every visit rather than cached blind: a deploy shows up on the next load,
# and an unchanged file costs a 304. The CSS and JS ship fingerprinted
# (tools/fingerprint.sh writes site.css?v=<hash> into every page), so a
# versioned URL never changes and is kept for a year; this is what lets a
# page transition start the moment the new page's HTML arrives. Fonts,
# screenshots and the product loops change rarely enough to cache; the PDFs
# may be replaced by camera-ready versions, so they get an hour.
map "$sent_http_content_type|$arg_v" $site_cache {
    "~^(text/css|text/javascript|application/javascript)[^|]*\|."  "public, max-age=31536000, immutable";
    default            "no-cache";
    ~^font/            "public, max-age=2592000";
    ~^image/           "public, max-age=86400";
    ~^video/           "public, max-age=86400";
    ~^application/pdf  "public, max-age=3600";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;

    # Traefik speaks https to the world; nginx only sees http on :80. Relative
    # redirects keep /research -> /research/ from pointing at http://...:80.
    absolute_redirect off;

    error_page 404 /404.html;

    # the second paper's file was renamed; old links still land on it
    location = /papers/tae.pdf { return 301 /papers/floors.pdf; }
    # browsers ask for this by name, for instance in a PDF's tab
    location = /favicon.ico { return 301 /assets/img/mark-180.png; }

    add_header Cache-Control $site_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# media.prigodskii.dev: the product loops, and nothing else. They used to
# share the pages' HTTP/2 connection, and a page asked for while a loop was
# downloading waited behind megabytes of video (whole seconds on a slow
# line). On a host of their own, with a certificate of their own so that
# browsers do not merge the two connections, they hold nothing else up.
# tools/media.sh points the shipped pages here (tools/deploy.sh).
server {
    listen 80;
    server_name media.prigodskii.dev;

    root /usr/share/nginx/html;
    server_tokens off;

    location /assets/video/ { }
    location / { return 404; }

    add_header Cache-Control $site_cache always;
    add_header X-Content-Type-Options "nosniff" always;
}
