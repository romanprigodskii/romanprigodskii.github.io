<!doctype html>
<!-- The social card, assets/img/og.png, 1200 x 630, in the site's clean light theme:
     the name, one factual line, the address with the mark, and two of the products
     on Gluline's mist stage (Vertex MMA in a browser window, Gluline on a phone).
     The stage runs from 40 to 590; the name's cap height starts on its top edge and
     the mark sits on its bottom edge.
     To render: serve the repo root (python3 -m http.server 8777) and screenshot
     http://localhost:8777/tools/og.html with Playwright, channel "chrome",
     viewport 1200 x 630, deviceScaleFactor 1. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social card</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family: "Mona Sans"; font-style: normal; font-weight: 200 900; font-stretch: 75% 125%; src: url("../assets/fonts/mona-sans-200-900-normal-latin.woff2") format("woff2"); }

:root {
  --bg: oklch(0.992 0.002 250);
  --ink: oklch(0.2 0.012 262);
  --ink-2: oklch(0.43 0.014 262);
  --f-sans: "Mona Sans", ui-sans-serif, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  position: relative; width: 1200px; height: 630px; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: var(--f-sans);
  font-variant-numeric: lining-nums proportional-nums;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
p, h1 { margin: 0; }

/* the text column, 64 to 584 */
.name {
  position: absolute; left: 64px; top: 26px;
  font-weight: 600; font-size: 120px; line-height: 0.92;
  letter-spacing: -0.052em; margin-left: -0.055em;
}
.name span { display: block; }
.line {
  position: absolute; left: 64px; top: 306px; width: 520px;
  font-size: 28px; line-height: 1.32; letter-spacing: -0.016em; color: var(--ink-2);
}
.line span { display: block; }
.url {
  position: absolute; left: 66px; bottom: 40px; height: 30px;
  display: flex; align-items: center; gap: 12px;
  font-weight: 600; font-size: 24px; line-height: 1; letter-spacing: -0.02em;
}
.url img { display: block; width: 30px; height: 30px; }
.url span { padding-bottom: 2px; }

/* the stage, tinted as Gluline's is on the site */
.stage {
  position: absolute; left: 616px; top: 40px; right: 40px; bottom: 40px;
  border-radius: 30px; overflow: hidden;
  background:
    radial-gradient(70% 60% at 8% 12%, oklch(0.9 0.07 188 / 0.95), transparent 70%),
    radial-gradient(60% 70% at 96% 92%, oklch(0.84 0.085 298 / 0.9), transparent 72%),
    radial-gradient(50% 50% at 60% 40%, oklch(0.95 0.03 230 / 0.9), transparent 80%),
    linear-gradient(140deg, oklch(0.93 0.045 196), oklch(0.9 0.055 285));
}

/* Vertex MMA, in a browser window that runs off the stage */
.win {
  position: absolute; left: 40px; top: 56px; width: 780px;
  border-radius: 12px; overflow: hidden; background: #000;
  box-shadow: 0 0 0 1px oklch(0.2 0.02 262 / 0.12), 0 2px 4px oklch(0.2 0.02 262 / 0.06), 0 30px 60px -28px oklch(0.2 0.03 262 / 0.55);
}
.win-bar { display: flex; align-items: center; height: 30px; padding: 0 12px; background: oklch(0.2 0.008 265); border-bottom: 1px solid oklch(0.3 0.01 265); }
.win-dots { display: flex; gap: 6px; }
.win-dots i { width: 9px; height: 9px; border-radius: 50%; background: oklch(0.36 0.01 265); }
.win-url { margin-left: 80px; width: 220px; height: 19px; display: flex; align-items: center; justify-content: center; border-radius: 5px; background: oklch(0.26 0.01 265); font: 500 11px/1 var(--f-sans); color: oklch(0.72 0.01 262); letter-spacing: -0.005em; }
.win img { display: block; width: 100%; height: auto; }

/* Gluline, on a phone rising from the stage's lower edge */
.phone {
  position: absolute; left: 272px; top: 160px; width: 232px; aspect-ratio: 800 / 1739;
  border-radius: 12.5% / 5.75%; overflow: hidden; background: oklch(0.14 0.01 265);
  box-shadow: 0 0 0 1px oklch(0.25 0.03 260 / 0.14), 0 2px 4px oklch(0.25 0.04 260 / 0.08), 0 30px 50px -18px oklch(0 0 0 / 0.55);
}
.phone img { display: block; width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
  <h1 class="name"><span>Roman</span> <span>Prigodskii</span></h1>
  <p class="line"><span>Forecasting models graded against</span> <span>the bookmaker&rsquo;s closing line.</span> <span>Co-founder and Head of AI at Gluline.</span></p>
  <p class="url"><img src="../assets/img/mark.svg" width="30" height="30" alt=""><span>prigodskii.dev</span></p>

  <div class="stage" aria-hidden="true">
    <div class="win">
      <div class="win-bar"><span class="win-dots"><i></i><i></i><i></i></span><span class="win-url">vertexmma.com</span></div>
      <img src="../assets/img/work/vertex-markets-1600.webp" width="1600" height="1000" alt="">
    </div>
    <div class="phone"><img src="../assets/img/work/gluline-chats-800.webp" width="800" height="1739" alt=""></div>
  </div>
</body>
</html>
