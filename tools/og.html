<!doctype html>
<!-- The social card, assets/img/og.png. Rendered at 1200x630 by headless Chrome:
     serve the repo root and screenshot /tools/og.html at that size. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: Archivo; font-weight: 100 900; font-stretch: 62% 125%;
  src: url("../assets/fonts/archivo-latin.woff2") format("woff2");
}
:root {
  --bg: oklch(0.198 0.030 132);
  --grid: oklch(0.242 0.032 132);
  --ink: oklch(0.948 0.020 95);
  --ink-2: oklch(0.800 0.030 118);
  --ink-3: oklch(0.660 0.032 124);
  --acc: oklch(0.860 0.190 142);
}
html, body { margin: 0; }
body {
  width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box;
  padding: 62px 72px 0;
  font-family: Archivo, sans-serif; color: var(--ink);
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 88px 88px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 88px 88px,
    var(--bg);
  position: relative;
}
.k {
  margin: 0; font-size: 15px; font-weight: 650; font-stretch: 68%;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3);
}
.k span { color: var(--acc); padding: 0 0.6em; }
h1 {
  margin: 14px 0 0; font-size: 128px; line-height: 0.92; font-weight: 780;
  font-stretch: 114%; letter-spacing: -0.035em;
}
.t { margin: 80px 0 0; font-size: 27px; line-height: 1.34; max-width: 22em; }
.f {
  position: absolute; left: 72px; bottom: 60px; margin: 0;
  display: flex; gap: 28px; font-size: 18px; color: var(--ink-3);
}
.f b { color: var(--acc); font-weight: 650; }
</style>
</head>
<body>
  <p class="k">Moscow<span>/</span>Applying for Fall 2027 entry</p>
  <h1>Roman<br>Prigodskii</h1>
  <p class="t">Forecasting models for UFC and boxing.<br>Co-founder and Head of AI at Gluline.</p>
  <p class="f"><b>prigodskii.dev</b><span>Vertex MMA</span><span>Gluline</span><span>Two papers under review</span></p>
</body>
</html>
