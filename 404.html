}

.nf-rule .rule-body { margin-right: var(--park); cursor: default; container-type: inline-size; }
.nf-rule .cursor { left: calc(100% + var(--park)); cursor: default; }

/* the tile arrives as one piece; then the cursor is thrown the length of the
   scale, from 1 past 1,680, and slows to a stop off the end */
@media (prefers-reduced-motion: no-preference) {
  .nf-b { animation: nf-arrive 1400ms var(--eo) 60ms backwards; }

@keyframes nf-arrive { from { opacity: 0; transform: translateY(36px) scale(0.985); } }
@keyframes nf-rise { from { opacity: 0; transform: translateY(0.16em); filter: blur(10px); } }
@keyframes nf-up { from { opacity: 0; transform: translateY(16px); } }
@keyframes nf-off { from { transform: translateX(calc(-100cqw - var(--park))); } }

/* below 1,100px the rule takes the full width of the tile under the line */
@media (max-width: 1100px) {
  .nf-rule { margin-top: clamp(28px, 4vw, 44px); }

  .nf-rule { --park: 19px; margin-top: 30px; }
